services:
  - type: web
    name: logovo-znaniy-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openrouter/free
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CHANNEL_USERNAME
        value: '@logovoznani'
